name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 on 1st and 15th every month

jobs:
  ctest:
    runs-on: ${{ matrix.os }}

    name: "OS: ${{ matrix.os }}, mpitest: ${{ matrix.mpi }}, OMP: ${{ matrix.ompsize }}"

    strategy:
      matrix:
        os: ["ubuntu-latest"]
        mpi: [true, false]
        ompsize: [1, 4]
        include:
          - os: "macos-latest"
            mpi: false
            ompsize: 1
        exclude:
          - os: "ubuntu-latest"
            mpi: true
            ompsize: 4
      fail-fast: false

    env:
      OMP_NUM_THREADS: ${{ matrix.ompsize }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: apt
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt update
          sudo apt install liblapack-dev openmpi-bin libopenmpi-dev libscalapack-openmpi-dev

      - name: brew
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install openmpi scalapack libomp blis

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: pip
        run: |
          python3 -m pip install numpy

      - name: make workspace
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: cmake
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          cmake --version
          if [ ${{ runner.os }} = "macOS" ] ; then
            # CONFIG=apple requires gfortran but macOS runner has not, but gfortran-11, 12, ...
            cmake -DCONFIG=apple -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_Fortran_COMPILER=gfortran-14 $GITHUB_WORKSPACE
          else
            cmake -DCMAKE_VERBOSE_MAKEFILE=ON $GITHUB_WORKSPACE
          fi

      - name: build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build ./ -j4

      - name: ctest without MPI
        if: ${{ matrix.mpi == false }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          if [ ${{ matrix.ompsize }} == 1 ]; then
            ctest --parallel 4 --output-on-failure -E '_mpi$'
          else
            ctest --output-on-failure -E '_mpi$'
          fi

      - name: ctest with MPI
        if: ${{ matrix.mpi == true }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: ctest --output-on-failure -R '_mpi$'

  nompi:
    name: "Linux, MPI=OFF, full CTest"
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install --yes gfortran liblapack-dev openmpi-bin libopenmpi-dev

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install numpy

      - name: Configure without MPI
        working-directory: ${{ github.workspace }}/..
        run: |
          mkdir -p build-nompi/ci-evidence
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > build-nompi/ci-evidence/source-sha.txt
          cmake -S "$GITHUB_WORKSPACE" -B build-nompi \
            -DCONFIG=gcc -DCMAKE_BUILD_TYPE=Release -DTesting=ON -DUSE_GEMMT=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_MPI=ON -DUSE_SCALAPACK=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee build-nompi/ci-evidence/configure.log
          cp build-nompi/CMakeCache.txt build-nompi/ci-evidence/

      - name: Build all targets
        working-directory: ${{ github.workspace }}/../build-nompi
        run: cmake --build . --parallel 4 2>&1 | tee ci-evidence/build.log

      - name: Check MPI isolation and disabled tests
        working-directory: ${{ github.workspace }}/../build-nompi
        run: |
          ldd src/mVMC/vmc.out > ci-evidence/ldd.txt
          nm -u src/mVMC/vmc.out > ci-evidence/undefined-symbols.txt
          if grep -Ei 'libmpi|libmpich|(^|[[:space:]])P?MPI_|not found' \
              ci-evidence/ldd.txt ci-evidence/undefined-symbols.txt; then
            exit 1
          fi
          ctest --show-only=json-v1 > ci-evidence/inventory.json
          python3 - <<'PYCODE'
          import json
          import pathlib
          import re
          cache = pathlib.Path('CMakeCache.txt').read_text()
          assert 'CMAKE_DISABLE_FIND_PACKAGE_MPI:UNINITIALIZED=ON' in cache or \
                 'CMAKE_DISABLE_FIND_PACKAGE_MPI:BOOL=ON' in cache
          commands = json.loads(pathlib.Path('compile_commands.json').read_text())
          assert commands and all('-D_mpi_use' not in c['command'] for c in commands)
          tests = json.loads(pathlib.Path('ci-evidence/inventory.json').read_text())['tests']
          assert tests, 'No registered tests'
          expected, disabled = set(), set()
          for test in tests:
              props = {p['name']: p['value'] for p in test.get('properties', [])}
              env = ';'.join(props.get('ENVIRONMENT', []))
              if ('requires_mpi' in props.get('LABELS', []) or
                      re.search(r'(^|;)MVMC_MPI_PROCS=([2-9]|[1-9][0-9]+)(;|$)', env)):
                  expected.add(test['name'])
              if props.get('DISABLED', False):
                  disabled.add(test['name'])
          assert disabled == expected, (sorted(disabled - expected), sorted(expected - disabled))
          assert len(tests) > len(disabled), 'All tests are disabled'
          print('Registered: {}, MPI-only disabled: {}'.format(len(tests), len(disabled)))
          pathlib.Path('ci-evidence/disabled.json').write_text(json.dumps(sorted(disabled)))
          PYCODE

      - name: Full CTest
        working-directory: ${{ github.workspace }}/../build-nompi
        run: |
          ctest --parallel 2 --output-on-failure --no-tests=error \
            --output-junit ci-evidence/ctest.xml 2>&1 | tee ci-evidence/ctest.log
          python3 - <<'PYCODE'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          disabled = set(json.loads(pathlib.Path('ci-evidence/disabled.json').read_text()))
          results = ET.parse('ci-evidence/ctest.xml').getroot().findall('testcase')
          assert results, 'No test results'
          actual_disabled = {t.attrib['name'] for t in results if t.attrib.get('status') == 'disabled'}
          assert actual_disabled == disabled, 'Disabled results differ from the inventory'
          skipped = {t.attrib['name'] for t in results if t.find('skipped') is not None}
          unexpected = skipped - disabled - {'GC_HPhi_CrossCheck'}
          assert not unexpected, 'Unexpected skipped tests: {}'.format(sorted(unexpected))
          print('Disabled:', len(actual_disabled), 'Optional skips:', sorted(skipped - disabled))
          PYCODE

      - name: Save noMPI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nompi-ctest-evidence
          path: ${{ github.workspace }}/../build-nompi/ci-evidence
          if-no-files-found: warn
